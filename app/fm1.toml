# VNL-1's build settings (fm1-base's tools/build.py: ./build.sh)
name = "VNL-1"                  # the name people see; the build's files: vnl-1.fwsc, vnl-1-X.Y.fwsc, vnl-1_host
id_prefix = "FM-1_22"          # dev FM-1_2200, releases FM-1_22XXYYZZ (taken: 0 default, 6 CTL-1, 7 AMB-1, 8 dub, 11 template, 13 Radio)
usb_manufacturer = "VNL-1"
usb_product = "VNL-1 FM-1"
include = ["song", "engine", "host", "ui", "drums"]   # the song engine, the voices, the simulator's score writer, the screens
o2 = ["song/*.c", "song/leads/*.c", "engine/*.c", "drums/*.c", "drums/fomajam/*.c", "host/*.c"]   # compiled apart at -O2 (the app's DSP; host/ is empty on the device)
device_include = ["inc"]       # the firmware's <string.h> (the toolchain is freestanding)
words = "words.tsv"
font_trim = true               # fm1-base's font packing: each glyph its lit box, Huffman-coded (the same pixels;
font_pack = true               # about 43 KB less flash than unpacked, 6 KB less than our old run-length packing)
ble = false                    # no radio: neither target (lo-fi, dub) needs it; saves ~130 KB flash
ble_central = false
backup = true                  # the saved songs and the home over USB (base/web/backup, tools/fm1_backup.py): OBJ_SETTINGS, OBJ_SONGS
backup_ext = "vnl1songs"
backup_holds = "the saved songs and the home screen"
# the site and firmware hubs (fm1-base tools/make_site.py, firmware.json; ours: tools/site.sh)
tagline = "A generative lo-fi DJ groovebox for the FM-1"
repo = "https://github.com/pianomansam/fm1-vnl"
licence = "GPL-3.0-only"        # the binary's (the GPL-3.0-only drum engines); the source is GPL-3.0-or-later (README)
credits = "Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments); drum engines from FOMAJAM and Optimist (GPL-3.0-only); reverb and chorus adapted from Mutable Instruments Rings by Emilie Gillet (MIT, Copyright 2014 Emilie Gillet; notice in LICENSES/MIT.txt)."
author = "pianomansam"
description = "VNL-1 writes and plays endless lo-fi hip hop songs on the FM-1, each with its own key, tempo, chords, layout and band: drums, bass, accompaniment, lead, pad and texture, through tape wobble, dust and a plate. Steer it from the knobs (key, tempo, mood, any part's instrument, sections) and every change lands on the next four-bar line. Sampled piano, guitars, cello, harp and room kits sit in a sample bank beside the firmware."
tags = ["generative", "groovebox"]
site = "https://pianomansam.github.io/fm1-vnl/"
install = "https://pianomansam.github.io/fm1-vnl/install/"
install_app = "web/install_app.js"   # the installer writes the sample bank after the firmware (tools/site.sh puts it beside the package)
screenshot = "app/site/img/nowplaying.png"

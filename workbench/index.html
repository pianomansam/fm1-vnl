<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VNL-1 Workbench</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #f6f4ef; --fg: #1f1d1a; --muted: #6b665d; --line: #d8d3c8; --accent: #b0562b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a18; --fg: #ece8df; --muted: #a39d91; --line: #3a3732; --accent: #e08a5c; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  .transport { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  button, input { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line);
                  border-radius: 6px; padding: 6px 12px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 72px; }
  input { width: 9ch; }
  #pos { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 12px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>VNL-1 Workbench</h1>
  <div class="transport">
    <button id="play" class="primary">Play</button>
    <label>Seed <input id="seed" type="number" min="1" value="21"></label>
    <button id="reseed">New seed</button>
    <span id="pos">bar – / –  ·  0:00</span>
  </div>
  <div class="bar"><div id="progress"></div></div>
</main>
<script type="module">
  import * as wb from "./wb.js";
  const $ = (id) => document.getElementById(id);
  let playing = false;
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  let booted = null;
  const boot = () => (booted ??= wb.start().then(() => {
    wb.onPosition(show);
    return wb.call("wb_seed", (+$("seed").value || 1) >>> 0);
  }));

  async function seed(n) {             // a new song: restarts at bar 1
    $("seed").value = n;
    await boot();
    await wb.call("wb_seed", n >>> 0);
  }

  $("play").onclick = async () => {
    await boot();
    playing = !playing;
    $("play").textContent = playing ? "Stop" : "Play";
    await wb.play(playing);
  };
  $("seed").onchange = () => seed(+$("seed").value || 1);
  $("reseed").onclick = () => seed(1 + Math.floor(Math.random() * 1e6));

  function show(p) {
    $("pos").textContent = `bar ${p.bar || "–"} / ${p.bars}  ·  ${fmt(p.seconds)}`;
    $("progress").style.width = `${p.bars ? (100 * Math.max(p.bar - 1, 0)) / p.bars : 0}%`;
  }
</script>
</body>
</html>

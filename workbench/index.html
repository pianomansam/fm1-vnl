<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VNL-1 Workbench</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #f6f4ef; --fg: #1f1d1a; --muted: #6b665d; --line: #d8d3c8; --accent: #b0562b; --moved: #f3dcc8;
          --panel: #fbfaf7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a18; --fg: #ece8df; --muted: #a39d91; --line: #3a3732; --accent: #e08a5c; --moved: #4a3022;
            --panel: #22211e; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  .transport { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  button, input, select { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line);
                          border-radius: 6px; padding: 6px 12px; }
  select { background: var(--panel); min-width: 0; width: 100%; padding: 5px 8px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 72px; }
  button:disabled { opacity: 0.45; }
  #pos { color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 12px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--accent); }
  /* the section strip: blocks scaled by bars, the playhead, the section sounding */
  #strip { position: relative; display: flex; gap: 2px; margin-top: 8px; height: 30px; }
  #strip button { flex: 1 1 0; min-width: 0; padding: 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
                  font-size: 12px; background: var(--panel); }
  #strip button.now { background: var(--moved); border-color: var(--accent); }
  #rollbox { overflow-x: auto; margin-top: 10px; border: 1px solid var(--line); border-radius: 6px; }
  #roll { display: block; }
  #strip .head { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--accent); pointer-events: none; }
  .switch { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  #msg { min-height: 1.4em; margin: 12px 0 0; color: var(--accent); }
  section { margin-top: 20px; }
  /* the page's sections (Song, the parts, Texture): well apart, a hairline between them */
  #desk > section { margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--line); }
  #desk > section:first-child { margin-top: 28px; padding-top: 0; border-top: 0; }
  h2 { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px;
       display: flex; gap: 12px; align-items: center; }
  .rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 4px 24px; }
  .row { display: grid; grid-template-columns: 9.5em 1fr auto auto auto auto; gap: 6px; align-items: center; padding: 2px 4px;
         border-radius: 6px; transition: background 0.6s; }
  .row.moved { background: var(--moved); }
  .row label { color: var(--muted); }
  .row button { padding: 4px 8px; line-height: 1; }
  .row button.lock[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  .row.locked select, .row.locked input { opacity: 0.7; }
  .row.inactive label, .row.inactive select { opacity: 0.45; }
  .row input { width: 100%; box-sizing: border-box; padding: 5px 8px; }
  @media (max-width: 520px) {
    .rows { grid-template-columns: 1fr; }
    .row { grid-template-columns: 7em 1fr auto auto auto auto; }
    .phead .sum { flex-basis: 100%; order: 9; }
  }
  /* a part's header: its name, a summary of its values, then mute and solo, ◀ 🎲 ▶ through its rolls, its lock and
     feedback on the roll heard */
  .phead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 6px; padding: 0 4px; }
  .phead h2 { margin: 0; }
  .phead .sum { flex: 1 1 12em; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .phead .roll { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .phead button { padding: 4px 8px; line-height: 1; }
  .phead button.part { font-size: 12px; font-weight: 600; padding: 4px 6px; }
  .phead button.part[aria-pressed="true"], .phead button.lock[aria-pressed="true"] { background: var(--accent);
    border-color: var(--accent); color: #fff; }
  .phead button.fb { opacity: 0.55; }
  .phead button.fb:hover { opacity: 1; }
  .phead.locked .sum { opacity: 0.7; }
  /* a section's folded rows: under its "more" */
  button.more { margin: 4px 4px 0; padding: 2px 8px; font-size: 12px; color: var(--muted); border-style: dashed; }
  button.more.moved { background: var(--moved); color: var(--fg); }
  .rows.folded { margin-top: 4px; }
  .rows.folded[hidden], .row[hidden] { display: none; }
  .feedback { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .feedback input { flex: 1 1 16em; min-width: 0; }
  #fb { color: var(--muted); }
  #fb.unsaved { color: var(--accent); font-weight: 600; }
  .row button.approve { grid-column: 2 / -1; grid-row: 2; justify-self: start; font-size: 12px; font-weight: 600; }  /* under its dropdown */
  .row button.fb { opacity: 0.55; }
  .row button.fb:hover { opacity: 1; }
  /* the drum screen (wider: both bars in view) */
  main:has(#drums:not([hidden])) { max-width: 1200px; }
  .dtop { display: flex; gap: 12px; align-items: center; margin-top: 20px; }
  .dtop h2 { margin: 0; }
  .dhead { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; margin-top: 10px; }
  .dhead label { color: var(--muted); margin-left: 6px; }
  .dhead select { width: auto; max-width: 15em; }
  .dhead button, .dgrid button { padding: 4px 8px; line-height: 1; }
  .dscroll { overflow-x: auto; margin-top: 12px; }
  .dgrid { border-collapse: collapse; }
  .dgrid th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: left; padding: 2px 6px; white-space: nowrap; }
  .dgrid th.now { color: var(--accent); }
  .dgrid td { padding: 3px 4px; white-space: nowrap; }
  .dgrid td label { color: var(--muted); }
  .dgrid select { width: 12em; }
  .dgrid .lvl { width: 4.5em; padding: 4px 6px; }
  .dgrid .dbtns { display: flex; gap: 4px; }
  .dgrid .steps { display: flex; gap: 2px; padding-right: 10px; }
  .dgrid button.step { width: 20px; height: 26px; padding: 0; font-size: 14px; border-color: var(--line); }
  .dgrid button.step.beat { border-color: var(--muted); }
  .dgrid button.step[data-state="hit"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dgrid button.step[data-state="ghost"] { background: var(--moved); }
  .dnote, .dkey { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>VNL-1 Workbench</h1>
  <div class="transport">
    <button id="play" class="primary">Play</button>
    <button id="all">🎲 Re-roll all unlocked</button>
    <span id="pos">bar – / –  ·  0:00</span>
    <label class="switch" title="Repeat the section playing instead of moving on"><input id="loop" type="checkbox"> 🔁 Loop section</label>
    <label class="switch"><input id="retired" type="checkbox"> Show retired</label>
  </div>
  <div class="bar"><div id="progress"></div></div>
  <div id="strip" role="group" aria-label="Sections: click to jump"></div>
  <div id="rollbox"><canvas id="roll" aria-label="Piano roll of the song playing (view only)" role="img"></canvas></div>
  <div class="feedback">
    <input id="note" type="text" placeholder="A note on the song (or on a row: then use its 👍 / 👎)" aria-label="Feedback note">
    <button id="up" title="This song is good">👍</button>
    <button id="down" title="This song is not good">👎</button>
    <button id="savenote" title="Save the note alone">Save note</button>
    <span id="fb" role="status" aria-live="polite"></span>
  </div>
  <p id="msg" role="status" aria-live="polite"></p>
  <section id="device" aria-label="Device screen (mock)">
    <button id="devfold" class="more" aria-controls="devbox"></button>
    <div id="devbox" hidden></div>
  </section>
  <div id="desk"></div>
  <div id="drums" hidden></div>
</main>
<script type="module">
  import * as wb from "./wb.js";
  import { ROWS, row, SECTIONS, RHYTHM_ROWS, rhythmRow, folds, summary, optionsFor, inactive, approval, compOption, COMP_PAT_BASE, fromEngine } from "./rows.js";
  import { Desk, PART_ROW, PART_NAME, sectionAt, positionOf, loopAt, endsSong } from "./desk.js";
  import { layout, draw } from "./roll.js";
  import { DrumScreen } from "./drums.js";
  const $ = (id) => document.getElementById(id);
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  let playing = false, desk = null, lib = null, pos = { seconds: 0, bar: 0 }, sentChanges = 0, drums = null, secs = [], heard = [];   // secs: the committed song's sections; heard: the playing song's
  let device = null, lastPos = { bar: 0, bars: 0, gap: 0 };   // the device mock (ui/panel.js) and the engine's last position

  // one change at a time: clicks queue behind the one in flight
  let queue = Promise.resolve();
  const run = (f) => (queue = queue.then(f).then((res) => { if (res) $("msg").textContent = res.message || ""; render(); })
                                 .catch((e) => { $("msg").textContent = String(e); }));

  async function boot() {
    await wb.start();
    const opts = await (await fetch("options.json")).json();
    lib = await wb.call("wb_library");
    const samples = new wb.Samples(wb.call, wb.C);
    await samples.check(opts);
    samples.preload().catch((e) => { $("msg").textContent = String(e); });   // before Play, so a load mid-song is rare
    desk = new Desk(wb.call, wb.C, opts, lib, { probe: wb.probe, position: () => pos, samples, events: wb.events });
    await wb.call("wb_seed", 21);
    await desk.read(true);
    const replaced = await desk.approvedKit();   // the boot song lands on an approved kit too, highlighted
    await wb.call("wb_apply");
    await desk.refresh();
    if (replaced) { desk.moved = new Set(["kit"]); $("msg").textContent = replaced; }
    await wb.call("wb_advance", $("loop").checked ? 0 : 1);   // the song's end: the next song (show)
    wb.onPosition(show);
    deviceMock();
    render();
    sync(await wb.flushFeedback());
  }

  // the device mock (ui/, served from disk: no rebuild): its knobs set rows as the rows do, its PLAY is Play. Folded
  // or open per viewer (wb-more's "Device"); a mistake in ui/ leaves the rest of the page working
  async function deviceMock() {
    const show = (on) => {
      $("devbox").hidden = !on;
      $("devfold").setAttribute("aria-expanded", String(on));
      $("devfold").textContent = `${on ? "▾" : "▸"} Device screen (mock): the FM-1's screen, its controls, the flow between screens`;
    };
    $("devfold").onclick = () => { const on = $("devbox").hidden; fold.set("Device", on); show(on); };
    show(fold.isOpen("Device"));
    try {
      const { mountDevice } = await import("./ui/panel.js");
      // every row's shown name (upper case, as the device writes), for screens that show the rolls: {kit}, {lead}, ...;
      // {rhythm}: the comp's one Rhythm row (comp rhythms or strum patterns)
      // what an "as rolled" row plays (wb_rolled: the engine's own choice), by row: shown after it, "AS ROLLED (HELD)"
      const rolledNames = (x) => {
        if (!x) return {};
        const o = desk.opts, up = (s) => (s == null ? undefined : String(s).toUpperCase());
        const comp = up(compOption(o, x.comp_pat >= 0 ? COMP_PAT_BASE + x.comp_pat : x.comp)?.name);
        const strum = up(o.strumPats?.find((p) => p.index === x.strum_pat)?.name);
        return { comp, strumPat: strum, rhythm: rhythmRow(desk.state, o) === "comp" ? comp : strum,
                 leadStyle: up(o.leadStyles?.find((s) => s.id === x.lead_style + 2)?.name), padOn: ["OFF", "ON"][x.pad_on],
                 padPlace: ["BELOW THE LEAD", "WITH THE LEAD", "ABOVE THE LEAD"][x.pad_place],
                 strumFill: ["STEP BACK", "DRIVE"][x.strum_fill], leadLoop: ["OFF", "ON"][x.lead_loop],
                 bassLine: ["ROOTS", "WALKING", "PEDAL"][x.bass_style] };
      };
      const labels = (x) => {
        const rn = rolledNames(x);
        const name = (id, as = id) => { const r = row(id), v = desk.state.values[id];
          const o = optionsFor(r, desk.state, desk.opts, { showRetired: true, lib }).find((y) => String(y.value) === String(v));
          const n = String(o?.short ?? o?.name ?? v ?? "").toUpperCase();
          return o?.rolled && rn[as] ? rn[as] : n; };   // the main screen's tiles: what plays
        return { ...Object.fromEntries(ROWS.map((r) => [r.id, name(r.id)])), rhythm: name(rhythmRow(desk.state, desk.opts), "rhythm") };
      };
      // the rows a screen's knobs can set: each row's value and its choices ({ value, name }, as the device writes
      // them); "rhythm" is the comp's one Rhythm row
      const rows = (x, heard) => {   // heard: wb_live_state (the song as it plays: a staged change not in it yet)
        const rn = rolledNames(x);
        const choices = (id, as = id) => optionsFor(row(id), desk.state, desk.opts, { lib }).filter((o) => !o.unavailable)
          .map((o) => { const n = String(o.short ?? o.name).toUpperCase();
                        return { value: o.value, name: o.rolled && rn[as] ? `${n} (${rn[as]})` : n }; });
        const rh = rhythmRow(desk.state, desk.opts), ids = ROWS.filter((r) => r.kind !== "seed" && r.kind !== "reroll").map((r) => r.id);
        const live = heard ? fromEngine(heard, wb.C, desk.opts) : null;
        if (live) live.rhythm = live[rh];
        return { values: { ...desk.state.values, rhythm: desk.state.values[rh] }, live, rolled: rn,
                 options: { ...Object.fromEntries(ids.map((id) => [id, choices(id)])), rhythm: choices(rh, "rhythm") } };
      };
      device = mountDevice($("devbox"), { call: wb.call, C: wb.C, labels, rows,
        engine: { set: (id, v) => run(() => desk.set(id === "rhythm" ? rhythmRow(desk.state, desk.opts) : id, v)), play: () => $("play").click() } });
    } catch (e) { $("devbox").textContent = `The device mock didn't load: ${e}`; }
  }

  function rowEl(r) {
    const el = document.createElement("div");
    el.className = "row";
    el.dataset.row = r.id;
    const lab = document.createElement("label");
    lab.textContent = r.short ?? r.label;   // (in its section: "Instrument" under Comp)
    lab.htmlFor = `in-${r.id}`;
    let input;
    if (r.kind === "seed") {
      input = document.createElement("input");
      input.type = "number";
      input.min = 1;
      input.onchange = () => run(() => desk.set("seed", +input.value || 1));
    } else {
      input = document.createElement("select");
      input.onchange = () => {
        const o = el.options.find((x) => String(x.value) === input.value);
        run(() => desk.set(r.id, o ? o.value : input.value));
      };
    }
    input.id = `in-${r.id}`;
    const dice = Object.assign(document.createElement("button"), { textContent: "🎲", title: `Re-roll ${r.label.toLowerCase()}` });
    dice.onclick = () => run(() => desk.dice(r.id));
    const lock = Object.assign(document.createElement("button"), { textContent: "🔒", className: "lock",
                                                                  title: `Keep ${r.label.toLowerCase()} when re-rolling` });
    lock.onclick = () => run(() => desk.lock(r.id, !desk.locks.has(r.id)));   // after the change in flight
    const fb = (rating, title) => Object.assign(document.createElement("button"), { textContent: rating === "up" ? "👍" : "👎",
      className: "fb", title: `${title} (with the note above)`, onclick: () => feedback(r.id, rating) });
    // a candidate pattern picked in the row: approve it (patterns/status.json; import.sh makes the roll draw it)
    const approve = Object.assign(document.createElement("button"), { textContent: "Approve", className: "approve", hidden: true });
    approve.onclick = () => { const t = approval(r, desk.state, desk.opts, lib); if (t) run(() => desk.approve(t)); };
    el.append(lab, input, dice, lock, approve, fb("up", `${r.label} is good`), fb("down", `${r.label} is not good`));
    // a part's roll (phrase, voicings, bass line, pad notes, drum variation): its 🎲 and 🔒 are the part header's
    if (r.part) for (const b of [dice, lock]) b.style.visibility = "hidden";
    Object.assign(el, { input, dice, lock, approve });
    return el;
  }

  // the decision list: built once, refreshed after every change
  const els = new Map(), toggles = new Map(), fold = folds();   // fold: each section's "more", per viewer
  function render() {
    if (!desk) return;
    if (!els.size) {
      for (const s of SECTIONS) {
        const sec = document.createElement("section"), box = document.createElement("div");
        sec.dataset.section = s.name;
        const head = s.part ? partHead(s) : Object.assign(document.createElement("h2"), { textContent: s.name });
        box.className = "rows";
        const add = (to, ids) => { for (const id of ids) { const el = rowEl(row(id)); els.set(id, el); to.append(el); } };
        add(box, s.main);
        sec.append(head, box);
        if (s.more.length) {   // the rest, folded (open or not: remembered per viewer)
          const more = Object.assign(document.createElement("div"), { className: "rows folded", id: `more-${s.name.toLowerCase()}` });
          add(more, s.more);
          const t = Object.assign(document.createElement("button"), { className: "more" });
          t.setAttribute("aria-controls", more.id);
          const show = (on) => {
            more.hidden = !on;
            t.setAttribute("aria-expanded", String(on));
            t.textContent = `${on ? "▾ Less" : "▸ More"}: ${s.more.map((id) => row(id).short ?? row(id).label).join(", ")}`;
          };
          t.onclick = () => { const on = more.hidden; fold.set(s.name, on); show(on); };
          show(fold.isOpen(s.name));
          toggles.set(s.name, t);
          sec.append(t, more);
        }
        $("desk").append(sec);
      }
    }
    renderParts();
    device?.changed();
    for (const s of SECTIONS)   // a folded row the last change moved: its "more" says so
      toggles.get(s.name)?.classList.toggle("moved", s.more.some((id) => desk.moved.has(id)));
    drums?.render(pos);
    strip().catch((e) => { $("msg").textContent = String(e); });
    const showRetired = $("retired").checked, rhythm = rhythmRow(desk.state, desk.opts);   // (Comp: one Rhythm row)
    for (const r of ROWS) {
      const el = els.get(r.id), cur = desk.values[r.id], locked = desk.locks.has(r.id);
      if (RHYTHM_ROWS.includes(r.id)) el.hidden = r.id !== rhythm;
      el.classList.toggle("moved", desk.moved.has(r.id));
      el.classList.toggle("locked", locked);
      el.lock.setAttribute("aria-pressed", String(locked));
      const why = inactive(r, desk.state, desk.opts);
      // (the Rhythm (comp) row stays open when greyed: a comp rhythm a snapshot left on keys that don't play one is
      // changed there)
      el.dice.disabled = locked || !!why;
      el.input.disabled = locked || (!!why && r.id !== "comp");
      el.classList.toggle("inactive", !!why);
      el.title = why || "";
      if (r.kind === "seed") { el.input.value = cur; continue; }
      const cand = approval(r, desk.state, desk.opts, lib), done = cand && desk.approved.has(`${cand.family}/${cand.id}`);
      el.approve.hidden = !cand;
      el.approve.disabled = !!done;
      el.approve.textContent = done ? "Approved: run import.sh" : "Approve";
      el.approve.title = !cand ? "" : done ? "Approved in patterns/status.json: run tools/patterns/import.sh so the firmware draws it"
        : `${cand.name} is a candidate: the roll never draws it. Approve it (patterns/status.json; then run tools/patterns/import.sh)`;
      el.options = optionsFor(r, desk.state, desk.opts, { showRetired, lib });
      el.input.replaceChildren(...el.options.map((o) => {
        const tag = (o.status === "retired" ? " (retired)" : o.status === "candidate" ? " (candidate)" : "") +
                    (o.unavailable ? " (unavailable: samples missing)" : "");
        const opt = new Option(o.name + tag, String(o.value), false, String(o.value) === String(cur));
        opt.disabled = !!o.unavailable;
        return opt;
      }));
    }
  }

  // a part's section header (Drums, Bass, Comp, Pad, Lead): its name and a summary of its values; mute and solo
  // (listening only); ◀ 🎲 ▶ through its rolls, and which it is; its lock (its roll row's); 👍 / 👎 on the roll heard
  const partEls = new Map();
  function partHead(s) {
    const p = s.part, name = PART_NAME[p], el = Object.assign(document.createElement("div"), { className: "phead" });
    el.dataset.part = p;
    const h = Object.assign(document.createElement("h2"), { textContent: s.name });
    const sum = Object.assign(document.createElement("span"), { className: "sum" });
    const roll = Object.assign(document.createElement("span"), { className: "roll" });
    const btn = (textContent, title, onclick, className = "") => Object.assign(document.createElement("button"), { textContent, title, onclick, className });
    const mute = btn("M", `Mute the ${name.toLowerCase()} (listening only: the song is unchanged)`,
                     () => run(() => desk.mute(p, !desk.listen.mute.has(p))), "part");
    const solo = btn("S", `Solo the ${name.toLowerCase()} (listening only: the song is unchanged)`,
                     () => run(() => desk.solo(desk.listen.solo === p ? null : p)), "part");
    const back = btn("◀", `${name}: the roll before`, () => run(() => desk.stepPart(p, -1)));
    const dice = btn("🎲", "", () => run(() => desk.reroll(p)));
    const fwd = btn("▶", `${name}: the roll after`, () => run(() => desk.stepPart(p, 1)));
    const lock = btn("🔒", `Keep the ${name.toLowerCase()}'s roll when re-rolling and on a new song`,
                     () => run(() => desk.lock(PART_ROW[p], !desk.locks.has(PART_ROW[p]))), "lock");
    const fb = (rating) => btn(rating === "up" ? "👍" : "👎", `${name}'s roll is ${rating === "up" ? "" : "not "}good (with the note above)`,
                               () => feedback(`part:${p}`, rating), "fb");
    el.append(h, sum, mute, solo, back, dice, fwd, roll, lock, fb("up"), fb("down"));
    if (p === "drums") el.append(btn("Edit kit & pattern", "The drum screen: each lane's sound and level, the pattern grid", () => screen(true)));
    partEls.set(p, Object.assign(el, { sum, roll, mute, solo, back, dice, fwd, lock }));
    return el;
  }
  function renderParts() {
    const parts = desk.parts, state = desk.state;
    for (const [p, x] of Object.entries(parts)) {
      const el = partEls.get(p), why = desk.cantRoll(p), n = x.history.length;
      el.sum.textContent = el.sum.title = summary(p, state, desk.opts);
      el.roll.textContent = p === "pad" && desk.padless ? "" : `${x.salt ? "re-rolled" : "as rolled"}${n > 1 ? ` · ${x.at + 1} of ${n}` : ""}`;
      el.mute.setAttribute("aria-pressed", String(desk.listen.mute.has(p)));
      el.solo.setAttribute("aria-pressed", String(desk.listen.solo === p));
      el.lock.setAttribute("aria-pressed", String(x.locked));
      el.classList.toggle("locked", x.locked);
      el.dice.title = why || `${PART_NAME[p]}: new notes (this part only; it lands at the next bar)`;
      el.dice.disabled = !!why;
      const stuck = desk.cantRoll(p, true);   // ◀ ▶ still step through a part whose 🎲 found no other roll
      el.back.disabled = !!stuck || x.at === 0;
      el.fwd.disabled = !!stuck || x.at === n - 1;
    }
  }

  // the section strip: the committed song's sections (wb_sections), read after each change; a click jumps (at the
  // next bar line when playing; stopped, it sets where Play starts)
  let stripKey = "";
  async function strip() {
    const next = await wb.call("wb_sections", 0);
    secs = next;
    heard = await wb.call("wb_sections", 1);
    const key = JSON.stringify(next);
    if (key !== stripKey) {
      stripKey = key;
      $("strip").replaceChildren(...next.map((x) => {
        const b = Object.assign(document.createElement("button"), { textContent: `${x.name} · ${x.bars}`,
          title: `Jump to ${x.name} (bar ${x.start + 1})` });
        b.style.flexGrow = x.bars;
        b.onclick = () => run(() => desk.jumpTo(x.start, x.name));
        return b;
      }), Object.assign(document.createElement("div"), { className: "head" }));
    }
    mark();
    roll().catch((e) => { $("msg").textContent = String(e); });
  }
  // the piano roll: the song as it plays. The committed song, unless a change is waiting for its bar line while the song
  // plays: then the song before it stays, and the roll redraws when it lands (each bar line is checked)
  let rollKey = "", rollLay = null, rollBusy = false, rollAgain = false;
  async function roll() {
    if (!desk) return;
    if (rollBusy) { rollAgain = true; return; }   // a check that came in mid-way runs once more after it
    rollBusy = true;
    try {
      const waiting = playing && (await wb.call("wb_pending"));
      if (!waiting) {
        const bytes = await wb.call("wb_commit_bytes"), key = bytes.join(",");
        if (key !== rollKey) {
          rollKey = key;
          const { events, chords } = await wb.events(bytes), sc = await wb.call("wb_sections", 0);
          rollLay = layout(events, sc, sc.reduce((m, x) => Math.max(m, x.start + x.bars), 0), wb.C.V, chords);
        }
      }
      paintRoll();
    } finally {
      rollBusy = false;
      if (rollAgain) { rollAgain = false; roll().catch((e) => { $("msg").textContent = String(e); }); }
    }
  }
  function paintRoll() {
    if (!rollLay) return;
    const x = draw($("roll"), rollLay, pos.bar, desk.listen), box = $("rollbox");
    if (x !== null && (x < box.scrollLeft || x + 40 > box.scrollLeft + box.clientWidth)) box.scrollLeft = Math.max(x - 40, 0);
  }
  // the playhead (the bar sounding) and the highlighted section
  function mark() {
    const el = $("strip"), total = secs.reduce((n, x) => n + x.bars, 0), cur = sectionAt(heard, pos.bar);
    secs.forEach((x, i) => el.children[i]?.classList.toggle("now", !!cur && x.start === cur.start && x.bars === cur.bars));
    const head = el.lastElementChild;
    if (head && total) {
      const at = Math.max(pos.bar - 1, 0), i = secs.findIndex((x) => at >= x.start && at < x.start + x.bars);
      // the blocks' gaps shift each block's left edge: the head sits in its block, by the bar within it
      const b = el.children[i];
      head.style.left = b ? `${b.offsetLeft + (b.offsetWidth * (at - secs[i].start)) / secs[i].bars}px` : "0px";
    }
  }

  $("play").onclick = async () => {
    await (desk ? null : booting);
    playing = !playing;
    $("play").textContent = playing ? "Stop" : "Play";
    await wb.play(playing);
    device?.position(lastPos, playing);
    roll().catch(() => {});
  };
  $("all").onclick = () => run(() => desk.rerollAll());
  $("retired").onchange = render;
  // looping a section never moves on: at the song's end (a loop checked in its silence) the engine plays it again
  $("loop").onchange = () => { if (desk) wb.call("wb_advance", $("loop").checked ? 0 : 1).catch(() => {}); };

  // feedback: the snapshot, where the song was, the change log and the note; queued and sent (wb.js). The snapshot is
  // taken in the queue, so a change in flight is never half in it
  function sync(s) {
    const dead = s.dead ? ` ${s.dead} refused by the server (kept in this browser, not saved).` : "";
    $("fb").textContent = (s.saved ? "Saved." : `Not saved yet: the server isn't answering (${s.queued} waiting, retrying).`) + dead;
    $("fb").classList.toggle("unsaved", !s.saved || !!s.dead);
  }
  async function feedback(about, rating) {
    const note = $("note").value.trim();
    if (!desk || (!rating && !note)) return;
    $("note").value = "";
    sync({ saved: false, queued: wb.queued() + 1 });
    const time = new Date().toISOString(), position = positionOf(pos, heard);   // the click's
    let entry = null;
    await run(async () => {
      const upto = desk.changes.length;   // the changes since the last entry
      entry = { time, snapshot: await desk.snapshot(), position, about, rating, note, changes: desk.changes.slice(sentChanges, upto) };
      sentChanges = upto;
    });
    if (entry) sync(await wb.sendFeedback(entry));
  }
  $("up").onclick = () => feedback("song", "up");
  $("down").onclick = () => feedback("song", "down");
  $("savenote").onclick = () => feedback("song", null);
  const retry = async () => { if (wb.queued()) sync(await wb.flushFeedback()); };
  setInterval(retry, 10000);
  addEventListener("online", retry);

  // the drum screen in place of the desk (the transport and the song stay)
  function screen(on) {
    if (on && !drums)
      drums = new DrumScreen($("drums"), { desk, call: wb.call, run, retired: () => $("retired").checked,
                                           audio: wb.resume, say: (m) => { $("msg").textContent = m; }, back: () => screen(false) });
    $("drums").hidden = !on;
    $("desk").hidden = on;
    render();
  }

  let lastGap = 0;   // the engine's silence after a song (wb_gap) the next song was rolled for
  function show(p) {
    // the song's end, as the device does it: its silence, then the next song, rolled as Re-roll all rolls (the locks
    // kept); it lands as the silence ends. Looping a section, never.
    if (playing && desk && endsSong(p.gap, lastGap, $("loop").checked)) run(() => desk.nextSong());
    if (p.gap) lastGap = p.gap;
    if (p.bar !== pos.bar && desk) wb.call("wb_sections", 1).then((s) => {   // a bar line: a landing may have changed the song heard
      heard = s; mark(); roll().catch(() => {});
      // looping: the section's last bar has begun → back to its start at the next bar line (a click on another section
      // during this bar still wins: the later jump replaces this one)
      const back = playing && $("loop").checked ? loopAt(heard, p.bar) : null;
      if (back !== null) wb.call("wb_jump", back).catch(() => {});
    }, () => {});
    if (drums && ((p.bar - 1) & 1) !== ((pos.bar - 1) & 1)) drums.render(p);   // the bar sounding (1 or 2)
    pos = { seconds: p.seconds, bar: p.bar };
    lastPos = p;
    device?.position(p, playing);
    $("pos").textContent = `bar ${p.bar || "–"} / ${p.bars}  ·  ${fmt(p.seconds)}`;
    mark();
    paintRoll();
    $("progress").style.width = `${p.bars ? (100 * Math.max(p.bar - 1, 0)) / p.bars : 0}%`;
  }

  const booting = boot().catch((e) => { $("msg").textContent = `The engine didn't load: ${e}`; });
</script>
</body>
</html>
